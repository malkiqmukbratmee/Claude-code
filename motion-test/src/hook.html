<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:PF;font-weight:900;src:url(fonts/pf900.ttf)}
@font-face{font-family:PFI;font-style:italic;font-weight:800;src:url(fonts/pf800i.ttf)}
@font-face{font-family:MR;font-weight:800;src:url(fonts/manrope800.ttf)}
@font-face{font-family:OS;font-weight:700;src:url(fonts/oswald700.ttf)}
:root{--ink:#2a2724;--red:#c8372d;--navy:#1d2f55;--chalk:#f7f7f2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#3d8b37}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.page{position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 45%,rgba(255,255,220,.10) 0%,rgba(0,0,0,0) 60%),
    repeating-linear-gradient(90deg,#3f8c38 0,#3f8c38 160px,#4a9a42 160px,#4a9a42 320px)}
.page .grain{position:absolute;inset:0;opacity:.9;mix-blend-mode:multiply}
.page svg.pitch{position:absolute;inset:0}
.el{position:absolute;transform-origin:50% 50%;opacity:0;will-change:transform}
.card{background:#fdfcf8;border-radius:10px;box-shadow:0 3px 4px rgba(0,0,0,.25),0 16px 34px rgba(0,0,0,.35);padding:16px}
.card img{display:block;width:100%;height:100%;object-fit:cover;border-radius:4px}
.card.logo img{object-fit:contain}
.tape{position:absolute;width:120px;height:38px;background:rgba(236,224,190,.85);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.label{font-family:MR;font-weight:800;font-size:34px;letter-spacing:.12em;color:var(--chalk);text-transform:uppercase;white-space:nowrap;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.35),0 3px 12px rgba(0,0,0,.45)}
.num{background:#fdfcf8;border:4px solid var(--ink);border-radius:6px;box-shadow:9px 9px 0 var(--ink),0 14px 30px rgba(0,0,0,.3);padding:8px 34px 14px;text-align:center}
.num .v{font-family:PF;font-weight:900;font-size:112px;line-height:1;color:var(--navy)}
.num .s{font-family:MR;font-weight:800;font-size:22px;letter-spacing:.14em;color:#57524c;margin-top:6px}
.hl{font-family:PFI;font-style:italic;font-weight:800;font-size:54px;color:var(--ink);background:#f5d54a;padding:2px 18px 8px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.stamp{font-family:OS;font-weight:700;font-size:132px;letter-spacing:.04em;color:#d63a2f;border:13px solid #d63a2f;border-radius:16px;padding:0 40px;line-height:1.15;background:rgba(255,255,255,.08);filter:url(#rough) drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.date{font-family:MR;font-weight:800;font-size:22px;letter-spacing:.16em;color:rgba(247,247,242,.85);border-bottom:3px solid rgba(247,247,242,.85);padding-bottom:6px;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.date b{font-family:PFI;font-style:italic;font-weight:800;font-size:60px;letter-spacing:0;color:var(--chalk);margin-left:14px}
svg.draw{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,20,0,.38) 100%);pointer-events:none}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    <feComponentTransfer><feFuncA type="discrete" tableValues="0 1 1 1 0.85 1"/></feComponentTransfer></filter>
  <filter id="grainf"><feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="7"/>
    <feColorMatrix values="0 0 0 0 0.10  0 0 0 0 0.25  0 0 0 0 0.08  0 0 0 0.22 0"/></filter>
  <filter id="chalkf"><feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/></filter>
</svg>

<div id="cam">
<!-- ============ PAGE 1: left half of the pitch ============ -->
<div class="page" id="p1">
  <svg class="grain" width="1920" height="1080"><rect width="1920" height="1080" filter="url(#grainf)"/></svg>
  <svg class="pitch" width="1920" height="1080"><g fill="none" stroke="rgba(255,255,255,.62)" stroke-width="7" filter="url(#chalkf)">
    <path d="M 2000 50 L 60 50 L 60 1030 L 2000 1030"/><line x1="1917" y1="50" x2="1917" y2="1030"/>
    <circle cx="1917" cy="540" r="190"/><rect x="60" y="250" width="300" height="580"/><rect x="60" y="410" width="110" height="260"/>
    <path d="M 360 440 A 130 130 0 0 1 360 640"/><path d="M 60 80 A 30 30 0 0 0 90 50"/><path d="M 90 1030 A 30 30 0 0 0 60 1000"/></g>
    <circle cx="260" cy="540" r="8" fill="rgba(255,255,255,.62)"/><circle cx="1917" cy="540" r="10" fill="rgba(255,255,255,.62)"/></svg>

  <div class="el" id="bigY" style="left:460px;top:300px;width:1000px;text-align:center;font-family:PF;font-weight:900;font-size:380px;line-height:1;color:var(--chalk);text-shadow:0 8px 0 rgba(0,0,0,.25),0 18px 40px rgba(0,0,0,.35)">2015</div>
  <div class="el date" id="date" style="left:110px;bottom:70px">ГОДИНА<b>2015</b></div>

  <div class="el card logo" id="crest1" style="left:130px;top:120px;width:420px;height:420px;padding:46px"><img src="img/crest.png"></div>
  <div class="el label" id="crest1L" style="left:40px;top:565px;width:600px">Локомотив Пловдив</div>
  <div class="el hl" id="hard" style="left:150px;top:630px">труден период</div>

  <div class="el card" id="fans" style="left:650px;top:110px;width:580px;height:360px"><img src="img/fans.jpg">
    <div class="tape" style="left:-34px;top:-12px;transform:rotate(-32deg)"></div><div class="tape" style="right:-34px;top:-12px;transform:rotate(32deg)"></div></div>
  <div class="el label" id="fansL" style="left:640px;top:495px;width:600px">Вярна публика</div>

  <div class="el card" id="hist" style="left:1290px;top:120px;width:540px;height:345px"><img src="img/hist_c.jpg">
    <div class="tape" style="left:210px;top:-20px;transform:rotate(-3deg)"></div></div>
  <div class="el label" id="histL" style="left:1260px;top:495px;width:600px">Голяма история</div>
  <div class="el num" id="year" style="left:1420px;top:570px;width:320px"><div class="v" id="yearV">1926</div><div class="s">ОСНОВАН</div></div>

  <div class="el num" id="money" style="left:690px;top:700px;width:500px"><div class="v" style="color:var(--red)">€ ???</div><div class="s">ФИНАНСОВО БЪДЕЩЕ</div></div>
  <div class="el stamp" id="stamp" style="left:960px;top:835px">НЕСИГУРНО</div>

  <svg class="draw"><path id="arr1" d="M 330 735 C 360 880, 540 900, 675 830" fill="none" stroke="#f7f7f2" stroke-width="10" stroke-linecap="round" filter="url(#chalkf)"/>
    <polygon id="arr1h" points="0,-18 36,0 0,18" fill="#f7f7f2"/></svg>
</div>

<!-- ============ PAGE 2: right half of the pitch ============ -->
<div class="page" id="p2">
  <svg class="grain" width="1920" height="1080"><rect width="1920" height="1080" filter="url(#grainf)"/></svg>
  <svg class="pitch" width="1920" height="1080"><g fill="none" stroke="rgba(255,255,255,.62)" stroke-width="7" filter="url(#chalkf)">
    <path d="M -80 50 L 1860 50 L 1860 1030 L -80 1030"/><line x1="3" y1="50" x2="3" y2="1030"/>
    <circle cx="3" cy="540" r="190"/><rect x="1560" y="250" width="300" height="580"/><rect x="1750" y="410" width="110" height="260"/>
    <path d="M 1560 440 A 130 130 0 0 0 1560 640"/><path d="M 1860 80 A 30 30 0 0 1 1830 50"/><path d="M 1830 1030 A 30 30 0 0 1 1860 1000"/></g>
    <circle cx="1660" cy="540" r="8" fill="rgba(255,255,255,.62)"/></svg>

  <div class="el card" id="man" style="left:190px;top:150px;width:470px;height:570px">
    <div id="sil" style="position:absolute;inset:16px;border-radius:4px;background:#d9d4ca;overflow:hidden">
      <svg viewBox="0 0 316 386" width="438" height="538" preserveAspectRatio="xMidYMid slice"><circle cx="158" cy="150" r="70" fill="#4a4540"/>
        <path d="M 30 386 C 30 270, 90 235, 158 235 C 226 235, 286 270, 286 386 Z" fill="#4a4540"/>
        <text x="158" y="178" text-anchor="middle" font-family="PF" font-weight="900" font-size="96" fill="#f4efe4">?</text></svg></div>
    <img id="krush" src="img/krush_c.jpg" style="position:absolute;inset:16px;width:438px;height:538px;opacity:0">
    <div class="tape" style="left:175px;top:-20px;transform:rotate(2deg)"></div>
  </div>
  <div class="el label" id="manL" style="left:125px;top:752px;width:600px">Бизнесмен</div>

  <div class="el" id="neq" style="left:730px;top:220px;font-family:PF;font-weight:900;font-size:320px;line-height:1;color:#e8473a;text-shadow:0 8px 20px rgba(0,0,0,.35)">≠</div>

  <div class="el card" id="typ" style="left:1080px;top:150px;width:620px;height:570px;padding:38px;text-align:center">
    <svg width="544" height="210" viewBox="0 0 384 150">
      <g transform="translate(120,75)"><circle r="62" fill="#fff" stroke="#24211e" stroke-width="5"/>
        <polygon points="0,-24 23,-7 14,20 -14,20 -23,-7" fill="#24211e"/>
        <path d="M0,-24 L0,-60 M23,-7 L57,-20 M14,20 L36,50 M-14,20 L-36,50 M-23,-7 L-57,-20" stroke="#24211e" stroke-width="5"/></g>
      <g transform="translate(270,80)"><path d="M -48 60 C -70 60 -66 0 -30 -18 L -16 -36 L -30 -58 L 30 -58 L 16 -36 L 30 -18 C 66 0 70 60 48 60 Z" fill="#c9a548" stroke="#24211e" stroke-width="5" stroke-linejoin="round"/>
        <text y="38" text-anchor="middle" font-family="PF" font-weight="900" font-size="56" fill="#24211e">€</text></g>
    </svg>
    <div style="font-family:PF;font-weight:900;font-size:66px;line-height:1.1;color:var(--navy);margin-top:18px">
      <div class="el w" id="w1" style="position:relative">ТИПИЧЕН</div>
      <div class="el w" id="w2" style="position:relative">ФУТБОЛЕН</div>
      <div class="el w" id="w3" style="position:relative">ИНВЕСТИТОР</div></div>
  </div>
  <svg class="draw"><g id="xg">
    <path id="x1" d="M 1110 185 L 1670 690" fill="none" stroke="#d63a2f" stroke-width="20" stroke-linecap="round" opacity=".95"/>
    <path id="x2" d="M 1670 185 L 1110 690" fill="none" stroke="#d63a2f" stroke-width="20" stroke-linecap="round" opacity=".95"/></g></svg>

  <svg class="draw"><path id="arr2" d="M 690 400 C 820 270, 1030 270, 1150 385" fill="none" stroke="#f7f7f2" stroke-width="11" stroke-linecap="round" filter="url(#chalkf)"/>
    <polygon id="arr2h" points="0,-19 38,0 0,19" fill="#f7f7f2"/></svg>
  <div class="el hl" id="fin" style="left:690px;top:455px;font-size:38px">финансовата издръжка</div>

  <div class="el card logo" id="crest2" style="left:1200px;top:140px;width:450px;height:450px;padding:50px"><img src="img/crest.png"></div>
  <div class="el label" id="crest2L" style="left:1125px;top:620px;width:600px">Локомотив Пловдив</div>
  <div class="el hl" id="bw" style="left:1215px;top:690px;font-size:60px">черно-белите!</div>
</div>
</div>
<div id="vig"></div>

<script>
const $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x));
const eOutBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eOutCub=x=>1-Math.pow(1-x,3);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

// ---- time map: animation times below are written on the raw-voice timeline;
// T() moves them onto the tightened (pauses removed) voice. TMAP comes from audio.py.
const KN=(window.TMAP&&window.TMAP.knots)||[[0,0],[100,100]];
const T=x=>{for(let i=1;i<KN.length;i++){const[a0,b0]=KN[i-1],[a1,b1]=KN[i];if(x<=a1){return a1===a0?b1:b0+(x-a0)*(b1-b0)/(a1-a0)}}const[a,b]=KN[KN.length-1];return b+(x-a)};
// ---- timeline (raw-voice seconds, synced to word timestamps) ----
const POPS=[ // id, start, rotation(deg)
 ['crest1',1.85,-2],['crest1L',2.05,0],
 ['fans',5.15,2],['fansL',5.3,0],
 ['hist',6.15,-2],['histL',6.3,0],['year',6.6,0],
 ['money',7.55,0],
 ['man',10.45,-1.5],['manL',11.0,0],
 ['neq',12.35,0],['typ',13.3,1.5],['w1',13.4,0],['w2',13.96,0],['w3',14.6,0],
 ['crest2',17.15,2],['crest2L',17.3,0],
];
const OUTS={neq:15.45,typ:15.45};          // scale-out times
const HL={hard:3.3,fin:17.25,bw:18.4};    // marker reveals
POPS.forEach(p=>p[1]=T(p[1])); for(const k in OUTS)OUTS[k]=T(OUTS[k]); for(const k in HL)HL[k]=T(HL[k]);
const SFX=[];                               // exported for audio mix (new timeline)
POPS.forEach(p=>{ if(!/L$|^w/.test(p[0])) SFX.push(['pop',p[1]]); });
['w1','w2','w3'].forEach(()=>0);
SFX.push(['tick',T(13.4)],['tick',T(13.96)],['tick',T(14.6)]);
SFX.push(['swish',HL.hard],['swish',HL.fin],['swish',HL.bw]);
const K={slide:T(9.62),stamp:T(9.0),date:T(1.5),bigIn:T(0.3),bigOut:T(1.3),year:T(6.6),arr1:T(7.7),arr2:T(16.85),x1:T(14.85),x2:T(15.02),out:T(15.45),flip:T(15.75),type:T(15.9),bounce:T(18.4)};
SFX.push(['stamp',K.stamp],['whoosh',K.slide],['scribble',K.x1],['whoosh',K.out],['flip',K.flip],['draw',K.arr1],['draw',K.arr2],['pop',K.bigIn],['whoosh',K.bigOut]);

function pop(el,t,t0,rot){
  const p=cl((t-t0)/0.28); if(t<t0){el.style.opacity=0;return}
  const s=0.5+0.5*eOutBack(p);
  el.style.opacity=cl((t-t0)/0.07);
  el.style.transform=`scale(${s}) rotate(${rot}deg)`;
}
function drawPath(pid,hid,t,t0,d){
  const p=$(pid),h=$(hid),L=p.getTotalLength(),k=eOutCub(cl((t-t0)/d));
  p.style.strokeDasharray=L; p.style.strokeDashoffset=L*(1-k);
  p.style.opacity=t<t0?0:1;
  if(h){ if(k<=0.02){h.style.opacity=0;return}
    const a=p.getPointAtLength(L*k),b=p.getPointAtLength(Math.max(0,L*k-6));
    const ang=Math.atan2(a.y-b.y,a.x-b.x)*180/Math.PI;
    h.setAttribute('transform',`translate(${a.x},${a.y}) rotate(${ang})`); h.style.opacity=1; }
}
function render(t){
  // camera: gentle push per page + stamp shake
  const page2=t>=K.slide;
  const base=page2?t-K.slide:t;
  let sc=1+0.035*cl(base/9);
  let sx=0,sy=0; if(t>K.stamp&&t<K.stamp+0.25){const k=1-(t-K.stamp)/0.25;sx=Math.sin(t*170)*9*k;sy=Math.cos(t*130)*7*k;}
  $('cam').style.transform=`translate(${sx}px,${sy}px) scale(${sc})`;
  // page slide
  const e=eInOut(cl((t-K.slide)/0.32));
  $('p1').style.transform=`translateX(${-1920*e}px)`;
  $('p2').style.transform=`translateX(${1920*(1-e)}px)`;
  // date tag
  { const el=$('date'),p=eOutCub(cl((t-K.date)/0.28)); el.style.opacity=p; el.style.transform=`translateY(${(1-p)*-14}px)`; }
  { const el=$('bigY'); if(t<K.bigIn) el.style.opacity=0; else if(t<K.bigOut){ pop(el,t,K.bigIn,0); }
    else { const p=eInOut(cl((t-K.bigOut)/0.28)); el.style.opacity=1-p;
      el.style.transform=`translate(${p*-700}px,${p*480}px) scale(${1-0.84*p})`; } }
  POPS.forEach(([id,t0,r])=>pop($(id),t,t0,r));
  // outs
  for(const id in OUTS){ const t0=OUTS[id]; if(t>t0){const p=cl((t-t0)/0.18); const el=$(id); el.style.opacity=1-p; el.style.transform=`scale(${1-0.25*eInOut(p)})`;}}
  // year counter
  { const p=eOutCub(cl((t-K.year)/0.55)); $('yearV').textContent=Math.round(2015-(2015-1926)*p); }
  // highlights
  for(const id in HL){ const t0=HL[id],el=$(id),p=eOutCub(cl((t-t0)/0.3));
    el.style.opacity=t<t0?0:1; el.style.transform='rotate(-1.5deg)'; el.style.clipPath=`inset(-10px ${100-100*p}% -10px -10px)`; }
  // arrows
  drawPath('arr1','arr1h',t,K.arr1,0.4);
  drawPath('arr2','arr2h',t,K.arr2,0.4);
  // stamp slam
  { const el=$('stamp'),t0=K.stamp; if(t<t0) el.style.opacity=0; else { const p=cl((t-t0)/0.1);
      el.style.opacity=0.2+0.75*p; el.style.transform=`rotate(-9deg) scale(${2.1-1.1*eOutCub(p)})`; } }
  // red X scribble
  { const k1=eOutCub(cl((t-K.x1)/0.18)),k2=eOutCub(cl((t-K.x2)/0.18));
    [['x1',k1],['x2',k2]].forEach(([id,k])=>{const p=$(id),L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L*(1-k);p.style.opacity=k>0?.92:0;});
    if(t>K.out){$('xg').style.opacity=1-cl((t-K.out)/0.18);} else $('xg').style.opacity=1; }
  // reveal flip: silhouette -> Krusharski
  { const m=$('man'); if(t>=K.flip){ const p=cl((t-K.flip)/0.24); const sxf=Math.abs(Math.cos(p*Math.PI));
      m.style.transform=`scaleX(${Math.max(0.02,sxf)}) rotate(-1.5deg) scale(${1+0.06*Math.sin(p*Math.PI)})`;
      const shown=p>=0.5; $('krush').style.opacity=shown?1:0; $('sil').style.opacity=shown?0:1; } }
  // label typewriter swap
  { const L=$('manL'); if(t>=K.type){ const s='Христо Крушарски',n=Math.round(s.length*cl((t-K.type)/0.3)); L.textContent=s.slice(0,n)||' '; } else { L.textContent='Бизнесмен'; } }
  // crest2 little bounce on "черно-белите"
  if(t>K.bounce){ const p=cl((t-K.bounce)/0.28); $('crest2').style.transform=`scale(${1+0.07*Math.sin(p*Math.PI)}) rotate(2deg)`; }
}
window.render=render; window.SFX=SFX;
</script>
</body></html>
